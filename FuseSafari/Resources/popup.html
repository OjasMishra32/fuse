<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --label: rgba(0,0,0,0.9); --secondary: rgba(60,60,67,0.6); --fill: rgba(120,120,128,0.12); --fill2: rgba(120,120,128,0.2); --sep: rgba(60,60,67,0.29); --accent: #0a7aff; --red: #ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --label: rgba(255,255,255,0.92); --secondary: rgba(235,235,245,0.6); --fill: rgba(120,120,128,0.18); --fill2: rgba(120,120,128,0.28); --sep: rgba(84,84,88,0.65); } }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; margin: 0; width: 340px; background: transparent; color: var(--label); font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
  .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .nav::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
  .body { max-height: 560px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 0 16px; }
  .card { background: var(--fill); border-radius: 14px; margin: 0 16px 12px; padding: 0 0 0 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 0; min-height: 44px; font-size: 15px; }
  .row + .row { border-top: 0.5px solid var(--sep); }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); flex: 0 0 auto; }
  .thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; flex: 0 0 auto; background: var(--fill2); }
  .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .muted { color: var(--secondary); font-size: 13px; }
  input { display: block; width: calc(100% - 32px); margin: 0 16px 12px; font: 15px -apple-system, system-ui; padding: 11px 14px; border: 0; border-radius: 12px; background: var(--fill); color: var(--label); outline: none; }
  input::placeholder { color: var(--secondary); }
  .primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 32px); margin: 0 16px; height: 44px; font: 600 17px -apple-system, system-ui; letter-spacing: -0.2px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
  .primary:active { opacity: 0.8; }
  .primary[disabled] { background: var(--fill2); color: var(--secondary); }
  .primary.busy { background: var(--fill2); color: var(--secondary); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(120,120,128,0.3); border-top-color: var(--secondary); animation: fuse-spin 0.8s linear infinite; display: none; }
  .busy .spin { display: block; }
  @keyframes fuse-spin { to { transform: rotate(360deg); } }
  #err { color: var(--red); font-size: 13px; margin: 10px 16px 0; display: none; }
  #result { display: none; }
  .actions { display: none; gap: 8px; margin: 4px 16px 0; }
  .actions button { flex: 1; height: 36px; font: 600 15px -apple-system, system-ui; border: 0; border-radius: 10px; background: var(--fill); color: var(--accent); }
  .actions button:active { background: var(--fill2); }
  .done .actions { display: flex; }
  .done #compose { display: none; }
  .done #result { display: block; }
</style></head>
<body>
  <div class="nav"><div class="nav-title">Fuse</div></div>
  <div class="body" id="body">
    <div id="compose">
      <div class="card" id="pages"><div class="row muted">Reading your pages</div></div>
      <input id="instruction" placeholder="What to make (optional)" autocomplete="off">
      <button class="primary" id="fuse"><span class="spin"></span><span id="fuse-label">Fuse these</span></button>
      <div id="err"></div>
    </div>
    <div id="result"></div>
    <div class="actions"><button id="copy">Copy</button><button id="again">Fuse again</button></div>
  </div>
  <script src="render.js"></script>
  <script src="popup.js"></script>
</body></html>
