<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui; margin: 0; padding: 16px; width: 280px; background: transparent; color: -apple-system-label; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  p { font-size: 12px; margin: 0 0 12px; color: gray; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; font: 600 14px -apple-system, system-ui; padding: 12px 8px; border: 0; border-radius: 12px; background: rgba(120,120,128,0.16); color: inherit; }
  button.done { background: #0a7aff; color: white; }
</style></head>
<body>
  <h1>Put this page on</h1>
  <p id="title">…</p>
  <div class="row"><button id="left">Left half</button><button id="right">Right half</button></div>
  <script src="popup.js"></script>
</body></html>
