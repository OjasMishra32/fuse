<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui; margin: 0; padding: 14px 16px 16px; width: 330px; background: transparent; color: -apple-system-label; }
  h1 { font-size: 17px; margin: 0 0 10px; font-weight: 600; letter-spacing: -0.2px; }
  .card { background: rgba(120,120,128,0.12); border-radius: 12px; padding: 4px 0; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14px; }
  .row + .row { border-top: 0.5px solid rgba(120,120,128,0.35); }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: #0a7aff; flex: 0 0 auto; }
  .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: rgba(120,120,128,1); font-size: 13px; }
  input { width: 100%; box-sizing: border-box; font: 14px -apple-system, system-ui; padding: 9px 11px; border: 0; border-radius: 10px; background: rgba(120,120,128,0.12); color: inherit; margin-bottom: 12px; }
  button { width: 100%; font: 600 15px -apple-system, system-ui; padding: 12px; border: 0; border-radius: 12px; background: #0a7aff; color: white; }
  button[disabled] { opacity: 0.5; }
  #result { display: none; margin-top: 12px; }
  #result h2 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  #result p { font-size: 14px; margin: 0 0 10px; }
  pre { white-space: pre-wrap; font: 13px -apple-system, system-ui; margin: 0; background: rgba(120,120,128,0.12); padding: 10px 12px; border-radius: 12px; max-height: 260px; overflow: auto; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { background: rgba(120,120,128,0.16); color: inherit; }
  #err { color: #ff3b30; font-size: 13px; margin-top: 8px; display: none; }
</style></head>
<body>
  <h1>Fuse</h1>
  <div class="card" id="pages"><div class="row muted">Reading your pages…</div></div>
  <input id="instruction" placeholder="Optional: what to make (e.g. compare them)">
  <button id="fuse">Fuse these</button>
  <div id="err"></div>
  <div id="result">
    <h2 id="rtitle"></h2>
    <p id="rsummary"></p>
    <pre id="rtext"></pre>
    <div class="actions"><button id="copy">Copy</button><button id="again">Fuse again</button></div>
  </div>
  <script src="popup.js"></script>
</body></html>
